name: Daily update

on:
  schedule:
    # 11:00 UTC = 4:30 PM IST, Monday to Friday (after market close)
    - cron: "0 11 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf 'TELEGRAM_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_TOKEN" "$TELEGRAM_CHAT_ID" > .env

      - name: Run pipeline (download, analyse, alert)
        run: python -m src.pipeline